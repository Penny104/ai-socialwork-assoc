<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>後台管理系統 — 科技與社會工作協會</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FDFBF7;--grid:#E8DCC4;--ink:#3E362E;--orange:#F26D5B;--yellow:#F4D35E;--blue:#5C8EAD;--green:#7D9D7F;--fh:'Fredoka',sans-serif;--fb:'Noto Sans TC',sans-serif;}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);min-height:100vh;}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:40px 40px;opacity:.35;}

/* LOGIN */
#login-wrap{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;}
.login-card{background:white;border:2px solid var(--ink);border-radius:20px;padding:3rem 2.75rem;width:100%;max-width:440px;box-shadow:7px 8px 0 var(--ink);position:relative;z-index:1;}
.login-badge{display:inline-block;background:var(--yellow);color:var(--ink);font-family:var(--fh);font-size:.75rem;font-weight:700;padding:.2rem .85rem;border-radius:4px;border:1.5px solid var(--ink);margin-bottom:1.1rem;letter-spacing:.08em;}
.login-title{font-family:var(--fh);font-size:2rem;font-weight:700;margin-bottom:.2rem;}
.login-sub{font-size:.84rem;color:#9a8a7a;margin-bottom:2.25rem;}
.lf{display:flex;flex-direction:column;gap:.35rem;margin-bottom:1.1rem;}
.lf label{font-family:var(--fh);font-size:.82rem;font-weight:600;letter-spacing:.04em;}
.lf input{border:2px solid var(--grid);border-radius:9px;padding:.7rem .95rem;font-family:var(--fb);font-size:.95rem;color:var(--ink);background:var(--bg);outline:none;transition:border-color .2s;}
.lf input:focus{border-color:var(--orange);}
.login-err{color:var(--orange);font-family:var(--fh);font-size:.82rem;min-height:1.4rem;margin-bottom:.5rem;}
.btn-login{width:100%;padding:.9rem;background:var(--ink);color:white;border:none;border-radius:11px;font-family:var(--fh);font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:4px 4px 0 var(--orange);transition:.2s;}
.btn-login:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--orange);}

/* NAV */
.admin-nav{position:sticky;top:0;z-index:200;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;padding:.75rem 2rem;background:rgba(253,251,247,.96);backdrop-filter:blur(14px);border-bottom:2px solid var(--ink);box-shadow:0 3px 0 var(--orange);}
.admin-brand{font-family:var(--fh);font-size:.9rem;font-weight:700;display:flex;align-items:center;gap:.5rem;margin-right:auto;text-decoration:none;color:var(--ink);}
.admin-brand-mark{width:34px;height:34px;background:var(--ink);color:white;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:8.5px;font-weight:700;line-height:1.25;text-align:center;flex-shrink:0;}
.tabs-row{display:flex;gap:.3rem;flex-wrap:wrap;}
.a-tab{font-family:var(--fh);font-size:.8rem;font-weight:600;padding:.42rem .85rem;border-radius:7px;border:2px solid transparent;background:transparent;cursor:pointer;color:var(--ink);transition:.18s;white-space:nowrap;}
.a-tab:hover{background:#fff0ee;border-color:var(--orange);color:var(--orange);}
.a-tab.active{background:var(--ink);color:white;border-color:var(--ink);}
.nav-front{font-family:var(--fh);font-size:.78rem;color:#9a8a7a;text-decoration:none;padding:.38rem .8rem;border-radius:7px;border:1.5px solid var(--grid);transition:.18s;white-space:nowrap;}
.nav-front:hover{border-color:var(--blue);color:var(--blue);}
.btn-logout{font-family:var(--fh);font-size:.78rem;font-weight:600;padding:.38rem .85rem;border-radius:7px;border:2px solid var(--grid);background:white;cursor:pointer;color:#9a8a7a;transition:.18s;}
.btn-logout:hover{border-color:var(--orange);color:var(--orange);}

/* MAIN */
#dashboard>main{position:relative;z-index:1;padding:2.25rem 2.5rem;max-width:1120px;margin:0 auto;}
.tab-panel{display:none;}.tab-panel.active{display:block;}

/* STATS */
.stats-row{display:flex;gap:1rem;margin-bottom:2rem;flex-wrap:wrap;}
.stat-card{flex:1;min-width:120px;background:white;border:2px solid var(--ink);border-radius:13px;padding:1.1rem 1.4rem;box-shadow:3px 4px 0 var(--ink);}
.stat-num{font-family:var(--fh);font-size:2rem;font-weight:700;}
.stat-lbl{font-size:.74rem;color:#9a8a7a;font-family:var(--fh);margin-top:.1rem;}

/* SEC TITLE */
.sec-title{font-family:var(--fh);font-size:1.15rem;font-weight:700;margin-bottom:1.1rem;padding-bottom:.5rem;border-bottom:2px solid var(--grid);}

/* BOOKING */
.bk-list{display:flex;flex-direction:column;gap:.9rem;}
.bk-card{background:white;border:2px solid var(--ink);border-radius:13px;padding:1.25rem 1.6rem;box-shadow:3px 4px 0 var(--ink);display:flex;align-items:flex-start;gap:1.25rem;}
.bk-date-box{flex-shrink:0;background:var(--yellow);border:2px solid var(--ink);border-radius:9px;padding:.5rem .8rem;text-align:center;min-width:64px;box-shadow:2px 3px 0 var(--ink);}
.bk-date-m{font-family:var(--fh);font-size:.66rem;font-weight:700;}
.bk-date-d{font-family:var(--fh);font-size:1.65rem;font-weight:700;line-height:1;}
.bk-info{flex:1;min-width:0;}
.bk-inst{font-family:var(--fh);font-size:1rem;font-weight:700;margin-bottom:.25rem;}
.bk-meta{font-size:.79rem;color:#7a6c60;line-height:2;}
.bk-meta span{display:inline-block;margin-right:.9rem;}
.bk-expect{font-size:.79rem;color:#6a5c50;margin-top:.35rem;line-height:1.7;padding:.4rem .65rem;background:#faf6f0;border-radius:6px;border:1px solid var(--grid);}
.bk-time{font-size:.68rem;color:#ccc;font-family:var(--fh);margin-top:.4rem;}
.btn-cancel{flex-shrink:0;padding:.5rem 1rem;background:white;color:var(--orange);border:2px solid var(--orange);border-radius:7px;font-family:var(--fh);font-size:.82rem;font-weight:700;cursor:pointer;transition:.18s;white-space:nowrap;box-shadow:2px 3px 0 var(--orange);}
.btn-cancel:hover{background:var(--orange);color:white;transform:translate(-1px,-1px);}
.bk-past{opacity:.55;}
.empty-state{text-align:center;padding:3.5rem 2rem;color:#bbb;font-family:var(--fh);font-size:1rem;}
.empty-icon{font-size:2.5rem;display:block;margin-bottom:.6rem;}

/* EDITOR BOX */
.editor-box{background:white;border:2px solid var(--ink);border-radius:15px;padding:1.6rem 1.85rem;box-shadow:4px 5px 0 var(--ink);margin-bottom:1.75rem;}
.editor-box-title{font-family:var(--fh);font-size:1rem;font-weight:700;margin-bottom:1.35rem;display:flex;align-items:center;gap:.55rem;}
.e-badge{font-size:.66rem;font-weight:700;padding:.14rem .55rem;border-radius:4px;background:var(--yellow);color:var(--ink);border:1.5px solid var(--ink);letter-spacing:.06em;}
.item-card{border:1.5px solid var(--grid);border-radius:9px;padding:1.1rem 1.2rem;margin-bottom:.9rem;background:var(--bg);position:relative;}
.item-num{font-family:var(--fh);font-size:.68rem;font-weight:700;color:var(--orange);letter-spacing:.1em;margin-bottom:.75rem;}
.ef{display:flex;flex-direction:column;gap:.28rem;margin-bottom:.65rem;}
.ef label{font-family:var(--fh);font-size:.74rem;font-weight:600;letter-spacing:.03em;}
.ef input,.ef textarea,.ef select{border:1.5px solid var(--grid);border-radius:6px;padding:.5rem .75rem;font-family:var(--fb);font-size:.86rem;color:var(--ink);background:white;outline:none;transition:border-color .2s;width:100%;}
.ef input:focus,.ef textarea:focus,.ef select:focus{border-color:var(--orange);}
.ef textarea{resize:vertical;min-height:72px;}
.ef select{font-family:var(--fh);cursor:pointer;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:.65rem;}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.65rem;}
.photo-row{display:flex;gap:.55rem;align-items:center;}
.photo-row .ef{flex:1;margin-bottom:0;}
.photo-prev{width:68px;height:50px;border-radius:7px;border:1.5px solid var(--grid);object-fit:cover;background:#f3ede4;flex-shrink:0;}
.btn-upload{padding:.44rem .8rem;background:var(--bg);color:var(--ink);border:1.5px solid var(--grid);border-radius:6px;font-family:var(--fh);font-size:.73rem;font-weight:600;cursor:pointer;transition:.18s;white-space:nowrap;display:inline-block;}
.btn-upload:hover{border-color:var(--orange);color:var(--orange);}
.save-row{display:flex;align-items:center;justify-content:flex-end;gap:.85rem;margin-top:1rem;}
.save-toast{font-family:var(--fh);font-size:.82rem;color:var(--green);font-weight:600;opacity:0;transition:opacity .3s;}
.save-toast.show{opacity:1;}
.btn-save{padding:.6rem 1.65rem;background:var(--ink);color:white;border:none;border-radius:8px;font-family:var(--fh);font-size:.9rem;font-weight:700;cursor:pointer;box-shadow:3px 3px 0 var(--orange);transition:.18s;}
.btn-save:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--orange);}
.btn-add{display:inline-flex;align-items:center;gap:.4rem;padding:.5rem 1.1rem;background:white;color:var(--ink);border:2px solid var(--grid);border-radius:8px;font-family:var(--fh);font-size:.82rem;font-weight:600;cursor:pointer;transition:.18s;margin-bottom:1rem;}
.btn-add:hover{border-color:var(--green);color:var(--green);}
.btn-del{position:absolute;top:.7rem;right:.7rem;width:26px;height:26px;background:white;border:1.5px solid var(--grid);border-radius:6px;cursor:pointer;font-size:.85rem;display:flex;align-items:center;justify-content:center;transition:.18s;}
.btn-del:hover{background:var(--orange);border-color:var(--orange);color:white;}
.course-items-ed{display:flex;flex-direction:column;gap:.5rem;margin-top:.5rem;}
.ci-row{display:flex;gap:.5rem;align-items:flex-start;}
.ci-row input{flex:0 0 34%;font-size:.82rem;}
.ci-row textarea{flex:1;min-height:50px;font-size:.82rem;}
.ci-row .btn-del{position:static;width:28px;height:28px;flex-shrink:0;margin-top:.25rem;}
.btn-add-item{font-family:var(--fh);font-size:.75rem;font-weight:600;color:var(--blue);background:transparent;border:none;cursor:pointer;padding:.25rem 0;display:inline-flex;align-items:center;gap:.3rem;}
.btn-add-item:hover{text-decoration:underline;}

@media(max-width:768px){
  #dashboard>main{padding:1.25rem .9rem;}
  .bk-card{flex-direction:column;gap:.65rem;}
  .btn-cancel{width:100%;}
  .two-col,.three-col{grid-template-columns:1fr;}
  .admin-nav{padding:.65rem 1rem;}
  .tabs-row{gap:.2rem;}
  .a-tab{font-size:.72rem;padding:.36rem .65rem;}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-wrap">
  <div class="login-card">
    <div class="login-badge">ADMIN PANEL</div>
    <h1 class="login-title">後台管理系統</h1>
    <p class="login-sub">社團法人臺灣科技與社會工作協會</p>
    <form id="login-form" autocomplete="on">
      <div class="lf"><label>帳號</label><input type="text" id="u" autocomplete="username" placeholder="請輸入帳號"></div>
      <div class="lf"><label>密碼</label><input type="password" id="p" autocomplete="current-password" placeholder="請輸入密碼"></div>
      <p class="login-err" id="login-err"></p>
      <button type="submit" class="btn-login">登入後台 →</button>
    </form>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" style="display:none;">
  <nav class="admin-nav">
    <a class="admin-brand" href="#">
      <div class="admin-brand-mark">後台<br>管理</div>科技與社會工作協會
    </a>
    <div class="tabs-row">
      <button class="a-tab active" data-tab="bookings">📋 預約管理</button>
      <button class="a-tab" data-tab="milestones">🏠 協會介紹</button>
      <button class="a-tab" data-tab="news">📰 最新動態</button>
      <button class="a-tab" data-tab="team">👥 核心團隊</button>
      <button class="a-tab" data-tab="members">👤 全體成員</button>
      <button class="a-tab" data-tab="courses">📚 課程簡介</button>
      <button class="a-tab" data-tab="lecturers">👩‍🏫 講師管理</button>
      <button class="a-tab" data-tab="settings">⚙️ 設定</button>
    </div>
    <a class="nav-front" href="index.html" target="_blank">前台 ↗</a>
    <button class="btn-logout" onclick="doLogout()">登出</button>
  </nav>

  <main>

    <!-- ① 預約管理 -->
    <div class="tab-panel active" id="tab-bookings">
      <div class="stats-row" id="stats-row"></div>
      <div class="sec-title">預約記錄</div>
      <div class="bk-list" id="bk-list"></div>
    </div>

    <!-- ② 協會介紹 -->
    <div class="tab-panel" id="tab-milestones">
      <div class="editor-box">
        <div class="editor-box-title">協會介紹投影片 <span class="e-badge">MILESTONES</span></div>
        <div id="slides-ed"></div>
        <div class="save-row"><span class="save-toast" id="t-slides">✓ 已儲存</span><button class="btn-save" onclick="saveSlides()">儲存變更</button></div>
      </div>
    </div>

    <!-- ③ 最新動態 -->
    <div class="tab-panel" id="tab-news">
      <div class="editor-box">
        <div class="editor-box-title">最新動態與消息 <span class="e-badge">NEWS</span></div>
        <button class="btn-add" onclick="addNews()">＋ 新增消息</button>
        <div id="news-ed"></div>
        <div class="save-row"><span class="save-toast" id="t-news">✓ 已儲存</span><button class="btn-save" onclick="saveNews()">儲存變更</button></div>
      </div>
    </div>

    <!-- ④ 核心團隊 -->
    <div class="tab-panel" id="tab-team">
      <div class="editor-box">
        <div class="editor-box-title">核心團隊成員 <span class="e-badge">CORE TEAM</span></div>
        <button class="btn-add" onclick="addTeam()">＋ 新增成員</button>
        <div id="team-ed"></div>
        <div class="save-row"><span class="save-toast" id="t-team">✓ 已儲存</span><button class="btn-save" onclick="saveTeam()">儲存變更</button></div>
      </div>
    </div>

    <!-- ⑤ 全體成員 -->
    <div class="tab-panel" id="tab-members">
      <div class="editor-box">
        <div class="editor-box-title">全體成員 <span class="e-badge">ALL MEMBERS</span></div>
        <button class="btn-add" onclick="addMember()">＋ 新增成員</button>
        <div id="members-ed"></div>
        <div class="save-row"><span class="save-toast" id="t-members">✓ 已儲存</span><button class="btn-save" onclick="saveMembers()">儲存變更</button></div>
      </div>
    </div>

    <!-- ⑥ 課程簡介 -->
    <div class="tab-panel" id="tab-courses">
      <div class="editor-box">
        <div class="editor-box-title">課程簡介與大綱 <span class="e-badge">COURSES</span></div>
        <button class="btn-add" onclick="addCourse()">＋ 新增課程卡片</button>
        <div id="courses-ed"></div>
        <div class="save-row"><span class="save-toast" id="t-courses">✓ 已儲存</span><button class="btn-save" onclick="saveCourses()">儲存變更</button></div>
      </div>
    </div>

    <!-- ⑦ 講師管理 -->
    <div class="tab-panel" id="tab-lecturers">
      <div class="editor-box">
        <div class="editor-box-title">授課講師資訊 <span class="e-badge">LECTURERS</span></div>
        <div id="lect-ed"></div>
        <div class="save-row"><span class="save-toast" id="t-lect">✓ 已儲存</span><button class="btn-save" onclick="saveLecturers()">儲存變更</button></div>
      </div>
    </div>

    <!-- ⑧ 基本設定 -->
    <div class="tab-panel" id="tab-settings">
      <div class="editor-box">
        <div class="editor-box-title">基本設定 <span class="e-badge">SETTINGS</span></div>
        <div class="two-col">
          <div class="ef"><label>聯絡 Email</label><input type="email" id="cfg-email" placeholder="tatswin2022@gmail.com"></div>
          <div class="ef"><label>聯絡電話</label><input type="tel" id="cfg-phone" placeholder="+886-2-0000-0000"></div>
        </div>
        <div class="save-row"><span class="save-toast" id="t-cfg">✓ 已儲存</span><button class="btn-save" onclick="saveCfg()">儲存變更</button></div>
      </div>
    </div>

  </main>
</div>

<script>
/* ═══ AUTH ═══ */
const CRED={u:'admin',p:'tatswin2024'};
if(sessionStorage.getItem('admin_ok')==='1') showDash();

document.getElementById('login-form').addEventListener('submit',function(e){
  e.preventDefault();
  if(document.getElementById('u').value.trim()===CRED.u && document.getElementById('p').value===CRED.p){
    sessionStorage.setItem('admin_ok','1'); showDash();
  } else {
    document.getElementById('login-err').textContent='帳號或密碼錯誤，請重試';
    document.getElementById('p').value='';
  }
});
function showDash(){
  document.getElementById('login-wrap').style.display='none';
  document.getElementById('dashboard').style.display='block';
  renderBookings(); renderSlides(); renderNews(); renderTeam(); renderMembers(); renderCourses(); renderLecturers(); loadCfg();
}
function doLogout(){sessionStorage.removeItem('admin_ok');location.reload();}

/* ═══ TABS ═══ */
document.querySelectorAll('.a-tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.a-tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  document.getElementById('tab-'+t.dataset.tab).classList.add('active');
}));

/* ═══ UTIL ═══ */
const MZ=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function sc(){return JSON.parse(localStorage.getItem('siteContent')||'{}');}
function saveSC(obj){localStorage.setItem('siteContent',JSON.stringify(obj));}
function toast(id){const el=document.getElementById(id);el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2500);}
function upload(e,cb){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>cb(ev.target.result);r.readAsDataURL(f);}

const CLR_OPTS=`<option value="orange">橘色</option><option value="blue">藍色</option><option value="green">綠色</option><option value="yellow">黃色</option>`;

/* ═══ BOOKINGS ═══ */
function renderBookings(){
  const all=JSON.parse(localStorage.getItem('bookings')||'[]').sort((a,b)=>a.date.localeCompare(b.date));
  const today=new Date().toISOString().slice(0,10);
  const up=all.filter(b=>b.date>=today);
  document.getElementById('stats-row').innerHTML=`
    <div class="stat-card"><div class="stat-num">${all.length}</div><div class="stat-lbl">總預約數</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--blue);">${up.length}</div><div class="stat-lbl">即將到來</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--green);">${all.length-up.length}</div><div class="stat-lbl">已完成</div></div>`;
  const list=document.getElementById('bk-list');
  if(!all.length){list.innerHTML='<div class="empty-state"><span class="empty-icon">📭</span>目前尚無預約記錄</div>';return;}
  list.innerHTML=all.map(b=>{
    const dt=new Date(b.date+'T00:00:00');
    return `<div class="bk-card${b.date<today?' bk-past':''}">
      <div class="bk-date-box"><div class="bk-date-m">${MZ[dt.getMonth()]}</div><div class="bk-date-d">${dt.getDate()}</div></div>
      <div class="bk-info">
        <div class="bk-inst">${esc(b.institution)}</div>
        <div class="bk-meta"><span>⏱ ${esc(b.hours)} 小時</span><span>📍 ${esc(b.location)}</span><span>📞 ${esc(b.phone)}</span><span>✉ ${esc(b.email)}</span></div>
        ${b.expectations?`<div class="bk-expect">${esc(b.expectations)}</div>`:''}
        <div class="bk-time">預約時間：${new Date(b.bookedAt).toLocaleString('zh-TW')}</div>
      </div>
      <button class="btn-cancel" onclick="cancelBooking('${b.id}')">取消預約</button>
    </div>`;
  }).join('');
}
function cancelBooking(id){
  if(!confirm('確定取消此預約？取消後該日期將重新開放預約。'))return;
  let all=JSON.parse(localStorage.getItem('bookings')||'[]');
  all=all.filter(b=>b.id!==id);
  localStorage.setItem('bookings',JSON.stringify(all));
  renderBookings();
}

/* ═══ MILESTONES (協會介紹) ═══ */
const DEF_SLIDES=[

function buildCoursesUI(){
  document.getElementById('courses-ed').innerHTML=crsData.map((c,i)=>`
    <div class="item-card">
      <button class="btn-del" onclick="crsData.splice(${i},1);buildCoursesUI()">✕</button>

        <div class="ef"><label>分類標籤</label><input id="cr-tag-${i}" value="${esc(c.tag)}"></div>
        <div class="ef"><label>顏色主題</label><select id="cr-col-${i}">${CLR_OPTS}</select></div>

      </div>
      <div class="ef"><label>課程標題</label><input id="cr-tit-${i}" value="${esc(c.title)}"></div>

        <div style="font-family:var(--fh);font-size:.74rem;font-weight:600;margin-bottom:.4rem;">課程項目</div>

        <button class="btn-add-item" onclick="crsData[${i}].items.push({bold:'項目名稱',text:'說明文字...'});buildCoursesUI()">＋ 新增項目</button>
      </div>
    </div>`).join('');
  crsData.forEach((c,i)=>{
    const el=document.getElementById(`cr-col-${i}`);if(el)el.value=c.color||'orange';
    const itemsEl=document.getElementById(`cr-items-${i}`);
    if(itemsEl)itemsEl.innerHTML=c.items.map((it,j)=>`
      <div class="ci-row">
        <input id="cr-ib-${i}-${j}" value="${esc(it.bold)}" placeholder="粗體標題">
        <textarea id="cr-it-${i}-${j}" rows="2">${esc(it.text)}</textarea>
        <button class="btn-del" onclick="crsData[${i}].items.splice(${j},1);buildCoursesUI()">✕</button>
      </div>`).join('');
  });
}
